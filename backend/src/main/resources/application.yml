spring:
  application:
    name: personal-finance-api
  datasource:
    url: ${FINANCE_DATABASE_RUNTIME_URL}
    username: ${FINANCE_DATABASE_RUNTIME_USERNAME}
    password: ${FINANCE_DATABASE_RUNTIME_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+00:00'
  flyway:
    enabled: true
    url: ${FINANCE_DATABASE_MIGRATION_URL}
    user: ${FINANCE_DATABASE_MIGRATION_USERNAME}
    password: ${FINANCE_DATABASE_MIGRATION_PASSWORD}
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    create-schemas: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never

logging:
  level:
    root: INFO
    org.springframework.web: INFO
  structured:
    format:
      console: logstash

finance:
  security:
    allowed-origin: "http://localhost:4200"
